apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "argus.name" . }}-config
  labels: {{- include "argus.labels" . | nindent 4 }}
data:
  taxonomy.json: {{ .Values.taxonomy | toJson | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "argus.name" . }}-runbooks
  labels: {{- include "argus.labels" . | nindent 4 }}
data:
{{- range $path, $_ := .Files.Glob (printf "kbs/%s/*.md" .Values.kb) }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
