# Phase 0 core services. Later phases add profiles (ml, agent, obs).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-argus}
      POSTGRES_DB: argus
    # 5433 on the host: a local Homebrew Postgres may already own 5432
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 768m

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333"]
    volumes: ["qdrantdata:/qdrant/storage"]
    mem_limit: 512m

  phoenix:
    profiles: ["obs"]
    image: arizephoenix/phoenix:latest
    ports: ["6006:6006", "4317:4317"]
    volumes: ["phoenixdata:/mnt/data"]
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    mem_limit: 1g

  kafka:
    profiles: ["streaming"]
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
    environment:  # single-node KRaft: no ZooKeeper
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    mem_limit: 900m

  airflow:
    profiles: ["orchestration"]
    image: apache/airflow:2.10.5-python3.12
    command: standalone  # one container: webserver, scheduler and a SQLite metadata DB; plenty for two DAGs
    ports: ["8080:8080"]
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      ARGUS_API: http://host.docker.internal:8000
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["./airflow/dags:/opt/airflow/dags", "airflowdata:/opt/airflow"]
    mem_limit: 1800m

volumes:
  airflowdata:
  phoenixdata:
  pgdata:
  qdrantdata:
